// GH Vita for Android: the same C game as the desktop test build (src/plat_sdl.c on SDL2, OpenGL ES 1.1), built by
// .github/workflows/android.yml. The art (assets/) is packed into the APK and unpacked on the first start.
plugins {
    id 'com.android.application'
}

def ghvBuild = (System.getenv('GHV_BUILD') ?: '1') as int

android {
    namespace 'org.ghvita.app'
    compileSdk 34
    // the runner's newest NDK, the one the libraries were built with: the path and its version have to agree
    def ndkHome = System.getenv('ANDROID_NDK_HOME')
    if (ndkHome) {
        ndkPath ndkHome
        ndkVersion new File(ndkHome).name
    }
    defaultConfig {
        applicationId 'org.ghvita.app'
        minSdk 26      // Android 8: libarchive wants nl_langinfo, which arrived then
        targetSdk 34
        versionCode ghvBuild
        versionName "build ${ghvBuild}"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'   // armeabi-v7a: 32-bit phones
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DGHV_BUILD=${ghvBuild}",
                          "-DSDL_SRC=${System.getenv('SDL_SRC') ?: ''}", "-DDEPS=${System.getenv('GHV_DEPS') ?: ''}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // one key for every build: each CI machine made its own debug key, and Android won't put an APK signed by another
    // key over the installed one, so no update could ever install (a sideloaded game, not a store build: the key's
    // in the repository)
    signingConfigs {
        ghv {
            storeFile file('../ghvita.keystore')
            storePassword 'ghvita'
            keyAlias 'ghvita'
            keyPassword 'ghvita'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.ghv
        }
        debug {
            signingConfig signingConfigs.ghv
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions {
        noCompress 'ogg', 'opus', 'jpg', 'png'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
