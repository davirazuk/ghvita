# Builds GH Vita on GitHub's machines and publishes it as a release, so the Vita's updater picks it up: no PC needed.
# Runs when a pushed commit's message has [release] in it, or by hand (Actions > Release > Run workflow).
# The art isn't in the repository: it comes out of the latest release's GHVita.vpk, so each release carries it on.
name: Release

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      notes:
        description: What changed (defaults to the commit's first line)
        required: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    # one release at a time; on the job, not the workflow, so a push without [release] can't push a waiting one out
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the build number is the commit count

      - name: Desktop build tools (for the smoke test)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libsdl2-dev libopusfile-dev libopus-dev \
            libmpg123-dev libvorbis-dev libogg-dev libcurl4-openssl-dev libarchive-dev libgl-dev zlib1g-dev \
            cmake ninja-build xvfb ffmpeg python3-numpy

      - name: VitaSDK
        run: |
          git clone -q --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
          sudo /tmp/vdpm/bootstrap-vitasdk.sh --install-dir $VITASDK
          sudo chown -R "$USER" $VITASDK
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          export PATH=$VITASDK/bin:$PATH
          libs="curl-mbedtls mbedtls libarchive un7zip opusfile opus mpg123 bzip2 zstd zlib libvorbis libogg vitaGL vitaShaRK libmathneon SceShaccCgExt taihen"
          # the supported series hasn't every library yet (2026-11: "target not found" for most of these): nightly has
          if ! (yes | vdpm install $libs); then
            yes | vdpm refresh nightly
            yes | vdpm install $libs
          fi

      - name: The art, from the latest release
        run: |
          gh release download --pattern GHVita.vpk --dir /tmp/last
          mkdir -p /tmp/last/x && cd /tmp/last/x && unzip -q ../GHVita.vpk
          cp -r /tmp/last/x/assets/. "$GITHUB_WORKSPACE/assets/"
          mkdir -p "$GITHUB_WORKSPACE/vita/sce_sys"
          cd /tmp/last/x/sce_sys && find . -name '*.png' -exec cp --parents {} "$GITHUB_WORKSPACE/vita/sce_sys/" \;
          echo "$(find "$GITHUB_WORKSPACE/assets" -type f | wc -l) asset files"

      - name: Guitar Hero pictures, made afresh from the source art (so a change to the set reaches the next build)
        run: |
          rm -rf assets/avatars
          if true; then
            pip install -q --break-system-packages py7zr pillow
            gh release download source-art --pattern ghwt-textures.7z --dir /tmp/sa
            python3 -c "import py7zr,re; z=py7zr.SevenZipFile('/tmp/sa/ghwt-textures.7z'); z.extract(path='/tmp/sa/x', targets=[n for n in z.getnames() if re.search(r'(ghwt_mag_|gh_logo|ghwt_logo_GH4|ghwt_setlist_griffin|ghwt_menu_bg)', n)])"
            python3 tools/mkavatars.py /tmp/sa/x/mods/yarg-look/YargLook/textures
          fi

      - name: Streak lamps, the footage's own crops (so the new lamp art reaches the build)
        run: |
          python3 tools/lampsync.py assets/game.png assets/game.txt tools/lampsrc

      # The 3D band and the venues' models are baked here from the source art (the PC that used to is gone): when the
      # last release's art hasn't this bake (assets/band3d/bake.txt), or has no venues, or the commit says [bake]
      - name: The 3D band and the venues, baked from the source art
        env:
          BAKE: band 6 (16000 and 22000 triangles, both loops, loose bones mended, fingers by colour, textures the right way up, hair kept, hair places for dyes)
        run: |
          said=$(git log -1 --format=%B | grep -c '\[bake\]' || true)
          band=0; venues=0
          [ "$(cat assets/band3d/bake.txt 2>/dev/null)" = "$BAKE" ] || band=1
          [ -f assets/venue3d/norway.v3d ] || venues=1
          if [ "$said" != 0 ]; then band=1; venues=1; fi
          if [ $band = 1 ] || [ $venues = 1 ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender python3-pil >/dev/null
            pip install -q --break-system-packages py7zr
            mkdir -p /tmp/sa
            [ -f /tmp/sa/ghwt-textures.7z ] || gh release download source-art --pattern ghwt-textures.7z --dir /tmp/sa
            gh release download source-art --pattern ghwt-tools.7z --dir /tmp/sa
            python3 -c "import py7zr; py7zr.SevenZipFile('/tmp/sa/ghwt-tools.7z').extractall('/tmp/sa/t'); z=py7zr.SevenZipFile('/tmp/sa/ghwt-textures.7z'); z.extract(path='/tmp/sa/v', targets=[n for n in z.getnames() if not n.endswith('.mp3')])"
            export GHWT_TOOLS=/tmp/sa/t/mods/refs/yarg/ghwt-tools BLENDER=$(which blender)
            tex=/tmp/sa/v/mods/yarg-look/YargLook/textures
            if [ $band = 1 ]; then
              rm -rf assets/band3d
              python3 tools/band.py --3d $tex /tmp/sa/work | grep ' 3d '
              python3 tools/band.py --3d --alt $tex /tmp/sa/work | grep -c ' 3d alt '
              python3 tools/band_bones.py assets/band3d
              test -f assets/band3d/guitarist.b3d && test -f assets/band3d/alt/guitarist.b3a && test -f assets/band3d/far/drummer.b3d
              echo "$BAKE" > assets/band3d/bake.txt
            fi
            if [ $venues = 1 ]; then
              rm -rf assets/venue3d
              python3 tools/venue3d.py $tex /tmp/sa/work | grep -c ' tris '
              test -f assets/venue3d/norway.v3d
            fi
          fi

      - name: The update token for a fresh install (the owner's read-only one, so a Vita without update.txt still updates)
        run: |
          [ -s android/update_token ] && cp android/update_token assets/update_token && echo "token in" || true

      - name: Build, smoke test and publish
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          Xvfb :77 -screen 0 1280x720x24 >/dev/null 2>&1 &
          export DISPLAY=:77
          notes="${{ github.event.inputs.notes }}"
          if [ -z "$notes" ]; then
            # every change since the last release, a line each
            last=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
            range=$([ -n "$last" ] && git rev-parse -q --verify "$last" >/dev/null && echo "$last..HEAD" || echo "-1")
            notes="$(git log $range --no-merges --format='- %s' | sed 's/ *\[release\]//')"
          fi
          python3 tools/release.py --notes "$notes"
